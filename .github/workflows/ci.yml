name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify PWA assets exist in build output
        run: |
          for asset in index.html manifest.json sw.js icon.svg icon-192.png icon-512.png; do
            if [ ! -f "dist/$asset" ]; then
              echo "Missing required PWA asset: dist/$asset"
              exit 1
            fi
          done
          echo "All expected PWA assets are present in dist/."
